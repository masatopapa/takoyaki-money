<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移転しました｜たこ焼き屋さんゲーム</title>
<meta name="theme-color" content="#e64a19">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="8;url=https://masatopapa.github.io/takoyaki-game/">
<link rel="canonical" href="https://masatopapa.github.io/takoyaki-game/">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic UI","Segoe UI",sans-serif;
    background:#fff3e0; color:#4e342e;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px; line-height:1.7;
  }
  .card{
    background:#fff; border-radius:20px; max-width:560px; width:100%;
    padding:36px 28px; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.12);
  }
  .mark{ font-size:52px; line-height:1; }
  h1{ font-size:clamp(21px,5vw,28px); color:#e64a19; margin:14px 0 6px; }
  .lead{ font-size:clamp(15px,3.6vw,17px); margin-bottom:24px; }
  .btn{
    display:block; background:#e64a19; color:#fff; text-decoration:none;
    font-size:clamp(17px,4.2vw,20px); font-weight:bold;
    padding:18px 20px; border-radius:14px; margin:0 0 10px;
    box-shadow:0 4px 0 #bf360c;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #bf360c; }
  .url{
    font-size:clamp(12px,3.2vw,14px); color:#795548; word-break:break-all;
    background:#fff3e0; border-radius:10px; padding:10px 12px; margin-bottom:22px;
  }
  .note{
    font-size:clamp(13px,3.3vw,15px); text-align:left;
    border-top:1px solid #ffccbc; padding-top:18px; color:#5d4037;
  }
  .note b{ color:#bf360c; }
  .count{ font-size:13px; color:#8d6e63; margin-top:16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🐙</div>
    <h1>新しいアドレスに移転しました</h1>
    <p class="lead">このページの「収支計算」は<b>使えなくなりました</b>。<br>下のボタンから新しいページへどうぞ。</p>

    <a class="btn" href="https://masatopapa.github.io/takoyaki-game/">新バージョンはこちら</a>
    <div class="url">https://masatopapa.github.io/takoyaki-game/<br>（短縮URL: https://tinyurl.com/takoyakiyasan）</div>

    <div class="note">
      新しいページでは <b>収支計算</b> と <b>サイコロ</b> の両方が使えます。<br>
      ホーム画面に追加していた方は、<b>このアイコンを削除して</b>、新しいページを開き直してから「ホーム画面に追加」をやり直してください。
    </div>

    <p class="count" id="count">8秒後に自動で移動します…</p>
  </div>

<script>
// 旧アプリのService Workerとキャッシュを片付けて、古い収支計算が残らないようにする
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
}
if (window.caches && caches.keys) {
  caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
}

var left = 8;
var el = document.getElementById('count');
setInterval(function () {
  left--;
  if (left <= 0) { location.replace('https://masatopapa.github.io/takoyaki-game/'); return; }
  el.textContent = left + '秒後に自動で移動します…';
}, 1000);
</script>
</body>
</html>
