<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たこ焼き屋さんゲーム 収支計算</title>
<meta name="theme-color" content="#e64a19">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic UI","Segoe UI",Tahoma,Verdana,sans-serif;
    background:#fff3e0; color:#333; -webkit-user-select:none; user-select:none;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{ font-family:inherit; cursor:pointer; border:none; }
  input{ font-family:inherit; }

  /* ===== ヘッダー ===== */
  header{
    background:#e64a19; color:#fff; padding:.7vh 1.2vw; display:flex; align-items:center;
    gap:.8vw; flex-wrap:wrap; box-shadow:0 2px 6px rgba(0,0,0,.15); flex:0 0 auto;
  }
  header h1{ font-size:clamp(15px,1.7vw,24px); font-weight:bold; flex:1; }
  .hbtn{
    background:rgba(255,255,255,.22); color:#fff; font-weight:bold; border-radius:8px;
    padding:.55em 1.1em; font-size:clamp(12px,1.1vw,16px);
  }
  .hbtn:active{ background:rgba(255,255,255,.4); }
  .hbtn:disabled{ opacity:.4; }

  /* ===== セットアップ画面 ===== */
  #setup-area{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  .setup-card{
    background:#fff; border-radius:16px; padding:3.5vh 3.5vw; text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
  }
  .setup-card h2{ color:#e64a19; font-size:clamp(18px,2vw,26px); margin-bottom:.9em; }
  .setup-row{ display:flex; align-items:center; justify-content:center; gap:.6em; margin-bottom:1.2em; flex-wrap:wrap; }
  .setup-row label{ font-weight:bold; font-size:clamp(14px,1.3vw,17px); }
  .setup-row input{
    border:2px solid #ffccbc; border-radius:8px; padding:.5em .6em; font-size:clamp(15px,1.4vw,18px);
    font-weight:bold; text-align:center; width:6em;
  }
  .start-button{
    background:#ff5722; color:#fff; font-weight:bold; border-radius:10px;
    padding:.7em 2.2em; font-size:clamp(16px,1.6vw,21px); box-shadow:0 4px 0 #bf360c;
  }
  .start-button:active{ transform:translateY(3px); box-shadow:0 1px 0 #bf360c; }
  .setup-note{ color:#a87d55; font-size:clamp(10px,1vw,13px); margin-top:1.4em; }

  /* ===== ゲーム画面全体（ダッシュボード）===== */
  #game-area{ display:none; flex:1; min-height:0; padding:1.2vh 1.2vw; }
  .dashboard{ display:flex; gap:1.2vw; width:100%; height:100%; min-height:0; }
  .main-col{ flex:1 1 68%; min-width:0; display:flex; flex-direction:column; gap:1vh; min-height:0; }
  .side-col{ flex:0 0 27vw; max-width:520px; display:flex; flex-direction:column; gap:1vh; min-height:0; }

  .card{ background:#fff; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.07); padding:1vh 1.2vw; }

  /* ===== プレイヤー見出し ===== */
  .player-head{ display:flex; align-items:center; justify-content:center; gap:1.4vw; flex:0 0 auto; }
  .player-head input.pname{
    border:2px solid #ffccbc; border-radius:8px; padding:.25em .5em; font-size:clamp(12px,1.1vw,15px);
    font-weight:bold; text-align:center; color:#d84315; width:7em; background:#fff8f2;
  }
  .player-head .lbl{ font-size:clamp(9px,.8vw,11px); color:#8a5a3a; font-weight:bold; }
  .player-head .val{ font-size:clamp(46px,6vw,80px); font-weight:bold; color:#bf360c; line-height:1; }

  .sec-ttl{ font-size:clamp(12px,1.1vw,15px); font-weight:bold; color:#8a5a3a; margin-bottom:.5vh; display:flex; align-items:center; gap:.4em; flex:0 0 auto; }

  /* ===== 材料・売上げカード（上）===== */
  .items-card{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .item-cols{ display:grid; grid-template-columns:1fr 1fr; gap:1.4vw; flex:1; min-height:0; }
  .item-col{ display:flex; flex-direction:column; min-height:0; }
  .item-col h4{ text-align:center; font-size:clamp(11px,1vw,14px); font-weight:bold; margin-bottom:.5vh; flex:0 0 auto; }
  .item-col.minus h4{ color:#c62828; }
  .item-col.plus h4{ color:#1565a8; }
  .item-grid{ display:grid; grid-auto-rows:1fr; gap:.8vh .8vw; flex:1; min-height:0; }
  .item-col.minus .item-grid{ grid-template-columns:repeat(2,1fr); }
  .item-col.plus .item-grid{ grid-template-columns:repeat(3,1fr); }
  .itembtn{
    color:#fff; font-weight:bold; border-radius:10px; font-size:clamp(12px,1.05vw,16px);
    line-height:1.3; box-shadow:0 3px 0 var(--sh); transition:transform .05s;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .itembtn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--sh); }
  .itembtn.minus{ background:#f44336; --sh:#b0281c; }
  .itembtn.plus{ background:#2196F3; --sh:#1565a8; }
  .itembtn .icost{ display:block; font-size:.82em; opacity:.9; font-weight:normal; }
  .itembtn .itag{ display:block; font-size:.68em; opacity:.85; font-weight:normal; }

  /* ===== イベントなど金額調整（下）===== */
  .coin-card{ flex:0 0 auto; }
  .coin-grid{ display:flex; gap:.8vw; }
  .coin-block{
    flex:1; display:flex; align-items:stretch; gap:.5vw;
    border:3px solid #ffccbc; border-radius:12px; padding:.5vh .5vw; background:#fffaf4;
  }
  .coinbtn{
    flex:1; border-radius:9px; color:#fff; font-weight:bold; font-size:clamp(18px,2.3vw,30px);
    box-shadow:0 4px 0 var(--sh); transition:transform .05s; min-height:9vh;
  }
  .coinbtn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--sh); }
  .coinbtn.plus{ background:#2196F3; --sh:#1565a8; }
  .coinbtn.minus{ background:#f44336; --sh:#b0281c; }
  .coin-label{
    flex:0 0 3.6em; display:flex; align-items:center; justify-content:center;
    background:#fff3e0; border-radius:8px; font-weight:bold; color:#5a3a20;
    font-size:clamp(14px,1.5vw,20px);
  }

  /* ===== スコアボード（右）===== */
  .scoreboard-card{ flex:0 0 auto; }
  .scoreboard{ display:flex; flex-direction:column; gap:.6vh; }
  .score-card{
    display:flex; align-items:center; justify-content:space-between; background:#fff3e0; border:2px solid #fff3e0;
    border-radius:10px; padding:.9vh 1vw; box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  .score-card.active{ border-color:#e64a19; background:#fff3ea; }
  .score-card .sc-name{ font-size:clamp(12px,1.05vw,15px); font-weight:bold; color:#8a5a3a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score-card .sc-money{ font-size:clamp(14px,1.2vw,17px); font-weight:bold; color:#bf360c; }

  /* ===== 履歴（右下）===== */
  .history-card{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .history-list{ flex:1; min-height:0; overflow-y:auto; background:#fffde7; border:1px solid #ffe0b2; border-radius:10px; padding:.8vh 1vw; }
  .history-list p{ font-size:clamp(11px,.95vw,14px); padding:.4em 0; border-bottom:1px dotted #ffe0b2; }
  .history-list p:last-child{ border-bottom:none; }
  .history-empty{ color:#c2ac80; font-size:clamp(11px,1vw,14px); text-align:center; padding:1em 0; }
</style>
</head>
<body>

<header>
  <h1>🐙 たこ焼き屋さんゲーム 収支計算</h1>
  <button class="hbtn" id="undoBtn" style="display:none;">🔙 1つ戻る</button>
  <button class="hbtn" id="resetBtn" style="display:none;">🔄 リセット</button>
</header>

<div id="setup-area">
  <div class="setup-card">
    <h2>ゲームの準備</h2>
    <div class="setup-row">
      <label for="player-count-input">プレイヤー人数（3〜5人）</label>
      <input type="number" id="player-count-input" value="4" min="3" max="5">
    </div>
    <div class="setup-row">
      <label for="init-money-input">はじめの所持金</label>
      <input type="number" id="init-money-input" value="390" min="0" step="10">
      <span>円</span>
    </div>
    <button class="start-button" id="startBtn">ゲーム開始</button>
    <div class="setup-note">マネリテDAO・たこ焼き屋さんゲーム用</div>
  </div>
</div>

<div id="game-area">
  <div class="dashboard">

    <div class="main-col">
      <div class="player-head">
        <input class="pname" id="apName" maxlength="12">
        <span class="lbl">所持金</span>
        <span class="val" id="apMoney">¥0</span>
      </div>

      <div class="card items-card">
        <div class="sec-ttl">🛒 材料・売上げカード</div>
        <div class="item-cols">
          <div class="item-col minus">
            <h4>マイナス（仕入れ・出費）</h4>
            <div class="item-grid" id="minusGrid"></div>
          </div>
          <div class="item-col plus">
            <h4>プラス（売上げ）</h4>
            <div class="item-grid" id="plusGrid"></div>
          </div>
        </div>
      </div>

      <div class="card coin-card">
        <div class="sec-ttl">💰 イベントなど金額調整</div>
        <div class="coin-grid">
          <div class="coin-block" data-coin="100">
            <button class="coinbtn minus">－</button>
            <div class="coin-label">100円</div>
            <button class="coinbtn plus">＋</button>
          </div>
          <div class="coin-block" data-coin="50">
            <button class="coinbtn minus">－</button>
            <div class="coin-label">50円</div>
            <button class="coinbtn plus">＋</button>
          </div>
          <div class="coin-block" data-coin="30">
            <button class="coinbtn minus">－</button>
            <div class="coin-label">30円</div>
            <button class="coinbtn plus">＋</button>
          </div>
          <div class="coin-block" data-coin="10">
            <button class="coinbtn minus">－</button>
            <div class="coin-label">10円</div>
            <button class="coinbtn plus">＋</button>
          </div>
        </div>
      </div>
    </div>

    <div class="side-col">
      <div class="card scoreboard-card">
        <div class="sec-ttl">👥 プレイヤー</div>
        <div class="scoreboard" id="scoreboard"></div>
      </div>
      <div class="card history-card">
        <div class="sec-ttl">📒 履歴</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  // ===== 商品・材料データ =====
  // -10円の仕入れ（ソース・マヨ・天かす・ねぎ）は「10円材料」に統合
  // 「イベント」枠は下の「イベントなど金額調整」で代用するので廃止
  var minusItems = [
    { name:'たこたん', cost:100 },
    { name:'きじたん', cost:100 },
    { name:'めんたいこ', cost:50 },
    { name:'チーズ', cost:40 },
    { name:'10円材料', cost:10 },
    { name:'魔法材料', cost:120 }
  ];
  var plusItems = [
    { name:'<span class="itag">（特別メニュー）</span><br>チーズクレープ', cost:350, histName:'チーズクレープ' },
    { name:'てんちゃん', cost:400 },
    { name:'マヨたこ', cost:400 },
    { name:'めんたい', cost:450 },
    { name:'のび～る', cost:500 },
    { name:'ねぎめんマヨ', cost:650 },
    { name:'大まんぞく', cost:1000 }
  ];

  var players = [];
  var activeIndex = 0;
  var historyStack = [];

  var setupArea = document.getElementById('setup-area');
  var gameArea = document.getElementById('game-area');
  var scoreboardEl = document.getElementById('scoreboard');
  var apNameEl = document.getElementById('apName');
  var apMoneyEl = document.getElementById('apMoney');
  var minusGridEl = document.getElementById('minusGrid');
  var plusGridEl = document.getElementById('plusGrid');
  var historyListEl = document.getElementById('historyList');
  var undoBtn = document.getElementById('undoBtn');
  var resetBtn = document.getElementById('resetBtn');

  function yen(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }

  function buildItemButtons(container, items, sign){
    container.innerHTML = '';
    items.forEach(function(it){
      var b = document.createElement('button');
      b.className = 'itembtn ' + (sign < 0 ? 'minus' : 'plus');
      b.innerHTML = it.name + '<span class="icost">' + (sign<0?'-':'+') + it.cost + '円</span>';
      var label = it.histName || it.name;
      b.addEventListener('click', function(){ changeMoney(activeIndex, sign*it.cost, label); });
      container.appendChild(b);
    });
  }

  function changeMoney(playerIndex, amount, item){
    var p = players[playerIndex];
    var oldMoney = p.money;
    var newMoney = p.money + amount;
    var msg;
    if(newMoney < 0 && amount < 0){
      newMoney = 0;
      msg = item + 'で' + Math.abs(amount) + '円へらそうとしましたが、所持金が足りず0円になりました。(残高 ' + yen(0) + ')';
    } else {
      msg = item + 'で' + (amount>0?'+':'') + amount + '円 (残高 ' + yen(newMoney) + ')';
    }
    historyStack.push({ playerIndex: playerIndex, oldValue: oldMoney });
    p.money = newMoney;
    p.history.push(msg);
    render();
  }

  function undoLastAction(){
    if(historyStack.length === 0) return;
    var last = historyStack.pop();
    players[last.playerIndex].money = last.oldValue;
    if(players[last.playerIndex].history.length > 0) players[last.playerIndex].history.pop();
    render();
  }

  function renderScoreboard(){
    scoreboardEl.innerHTML = '';
    players.forEach(function(p, i){
      var card = document.createElement('div');
      card.className = 'score-card' + (i===activeIndex ? ' active' : '');
      card.innerHTML = '<span class="sc-name">' + escapeHtml(p.name) + '</span><span class="sc-money">' + yen(p.money) + '</span>';
      card.addEventListener('click', function(){ activeIndex = i; render(); });
      scoreboardEl.appendChild(card);
    });
  }

  function renderActivePanel(){
    var p = players[activeIndex];
    apNameEl.value = p.name;
    apMoneyEl.textContent = yen(p.money);

    historyListEl.innerHTML = '';
    if(p.history.length === 0){
      var e = document.createElement('div');
      e.className = 'history-empty';
      e.textContent = 'まだ きろくがないよ';
      historyListEl.appendChild(e);
    } else {
      p.history.slice(-30).slice().reverse().forEach(function(m){
        var row = document.createElement('p');
        row.textContent = m;
        historyListEl.appendChild(row);
      });
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(){
    renderScoreboard();
    renderActivePanel();
    undoBtn.disabled = historyStack.length === 0;
  }

  // コインボタン
  Array.prototype.forEach.call(document.querySelectorAll('.coin-block'), function(row){
    var v = Number(row.dataset.coin);
    row.querySelector('.coinbtn.plus').addEventListener('click', function(){ changeMoney(activeIndex, v, v+'円'); });
    row.querySelector('.coinbtn.minus').addEventListener('click', function(){ changeMoney(activeIndex, -v, v+'円'); });
  });

  buildItemButtons(minusGridEl, minusItems, -1);
  buildItemButtons(plusGridEl, plusItems, 1);

  apNameEl.addEventListener('change', function(){
    var v = apNameEl.value.trim();
    players[activeIndex].name = v || ('プレイヤー' + (activeIndex+1));
    render();
  });

  undoBtn.addEventListener('click', undoLastAction);
  resetBtn.addEventListener('click', function(){
    if(!confirm('ゲームをリセットしますか？全員のデータが失われます。')) return;
    setupArea.style.display = 'flex';
    gameArea.style.display = 'none';
    undoBtn.style.display = 'none';
    resetBtn.style.display = 'none';
    players = []; historyStack = []; activeIndex = 0;
    document.getElementById('player-count-input').value = 4;
    document.getElementById('init-money-input').value = 390;
  });

  document.getElementById('startBtn').addEventListener('click', function(){
    var countInput = document.getElementById('player-count-input');
    var count = parseInt(countInput.value, 10);
    if(isNaN(count) || count < 3 || count > 5){
      alert('プレイヤー人数は3人から5人の間で選択してください。');
      return;
    }
    var initMoney = parseInt(document.getElementById('init-money-input').value, 10);
    if(isNaN(initMoney) || initMoney < 0) initMoney = 390;

    players = [];
    historyStack = [];
    activeIndex = 0;
    for(var i=0;i<count;i++){
      players.push({ name:'プレイヤー'+(i+1), money:initMoney, history:['ゲーム開始！ 所持金'+initMoney+'円です。'] });
    }

    setupArea.style.display = 'none';
    gameArea.style.display = 'flex';
    undoBtn.style.display = 'inline-block';
    resetBtn.style.display = 'inline-block';
    render();
  });
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
